<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>张婷婷 · 个人简历</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #0a0a0f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
    padding-bottom: 120px;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: rgba(10, 10, 15, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 13px;
    color: rgba(255, 255, 255, 0.75);
  }
  .bar b { color: #fff; font-weight: 600; }
  .bar .hint { flex: 1; }
  .bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #77dfe8; flex-shrink: 0; }
  .pages { padding: 20px 14px 0; }
  .pages img {
    display: block;
    width: 100%;
    max-width: 720px;
    margin: 0 auto 16px;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  .tip {
    margin: 6px 20px 0;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 13px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.8);
  }
  .tip b { color: #fff; }
  .download {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    z-index: 10;
    display: block;
    height: 50px;
    line-height: 50px;
    text-align: center;
    border-radius: 999px;
    background: #423fff;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(66, 63, 255, 0.4);
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot"></span>
    <span class="hint"><b>简历预览</b> · 张婷婷 / UI&nbsp;UX 设计师</span>
  </div>

  <div class="tip">
    微信内已可直接查看完整简历。<br>
    如需<b>下载 PDF 原件</b>：点击右上角 <b>···</b> → 选择「<b>在浏览器中打开</b>」，再点下方按钮即可保存。
  </div>

  <div class="pages">
    <img src="/images/resume/resume-1.png" alt="简历第 1 页">
    <img src="/images/resume/resume-2.png" alt="简历第 2 页">
  </div>

  <a class="download" href="/resume.pdf" download>下载 PDF 简历</a>
</body>
</html>
